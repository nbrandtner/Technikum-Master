[theme]
base = "dark"
primaryColor = "#b65f26"
backgroundColor = "#10161d"
secondaryBackgroundColor = "#1a232e"
textColor = "#e7edf3"
linkColor = "#f0ab70"
borderColor = "#334354"
codeBackgroundColor = "#17212b"
codeTextColor = "#e7edf3"
dataframeHeaderBackgroundColor = "#243140"
font = "sans serif"

[server]
headless = true
address = "127.0.0.1"
port = 8501
runOnSave = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
