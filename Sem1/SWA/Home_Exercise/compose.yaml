name: earlybird-boundary-lab
services:
  neo4j:
    image: neo4j:2026.10.1
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      # Local educational database only; neither port is exposed to the LAN.
      NEO4J_AUTH: none
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - earlybird_data:/data
      - earlybird_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
volumes:
  earlybird_data:
  earlybird_plugins:
