[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "earlybird-boundary-lab"
version = "0.1.0"
description = "A reproducible investigation of requirements embeddings and architectural boundaries"
requires-python = ">=3.11,<3.15"
dependencies = [
  "sentence-transformers>=5,<7", "streamlit>=1.45,<2", "plotly>=6,<8",
  "scikit-learn>=1.6,<2", "neo4j>=5.26,<7", "numpy>=2,<3", "pandas>=2,<4",
  "pypdf>=6,<7", "huggingface-hub>=0.30,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
earlybird = "earlybird.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
